# cargo-features = [ "codegen-backend", "trim-paths" ]
# cargo-features = [ "codegen-backend", "profile-rustflags", "trim-paths" ]
# cargo-features = ["profile-rustflags", "trim-paths"] # required for both trimming paths and setting rustflags
# The aboe also needs the profile.dev to be uncommented to use the cranelift backend
[package]
name        = "keeper-cli"
version     = "0.1.0"
authors     = [ "MrDwarf7", "Blake B. <github.com/MrDwarf7>" ]
edition     = "2024"
description = "Keeper Password Manager CLI: a Rust rebuild of Keeper Commander's core"
# license = "MIT"
license-file = "LICENSE"
readme       = "README.md"
build        = "build.rs"
# For running the main server as a watch, call
# cargo watch -q -c -w src/ -x run

######################################################################################################################################################
######################################################################################################################################################


# Windows exe icon + version info (release builds). Assets under assets/icon.ico.
[package.metadata.winresource]
OriginalFilename = "keeper-cli.exe"
FileDescription  = "Keeper Password Manager CLI"
LegalCopyright   = "Copyright (c) Blake B. @github.com/MrDwarf7"
#CompanyName = "https://github.com/MrDwarf7"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.19"

######################################################################################################################################################
######################################################################################################################################################


[dependencies]
aes           = "0.8"
aes-gcm       = "0.10"
cbc           = "0.1"
clap          = { version = "4.6.7", features = [ "derive", "env" ] }
config        = { version = "0.15.27", default-features = false, features = [ "json" ] }
data-encoding = "2.11.1"
dirs          = "7.0.0"
hmac          = "0.12"
p256          = { version = "0.13", features = [ "ecdh" ] }
pbkdf2        = "0.12"
prost         = "0.14.4"
rand          = "0.8"
reqwest       = { version = "0.13.5", default-features = false, features = [ "blocking", "rustls" ] }
rpassword     = "7.5.4"
rsa           = "0.9.10"
serde         = { version = "1.0.229", features = [ "derive" ] }
serde_json    = "1.0.154"
sha1          = "0.10"
sha2          = "0.10"
shlex         = "2.0.1"
# eyre = "*"
# dotenvy = "*"
# futures = "*"
#
# clap = { version = "*", features = [ "derive" ] } # Optionall: "env"
# anstyle = "*"

# Base dependencies/Commons
# reqwest = { version = "*", features = ["cookies", "json", "multipart", "stream"] }
# uuid = { version = "*", features = ["v4"] }
# serde = { version = "*", features = ["derive"] }
# serde_json = "*"
thiserror = "*"
# tokio = { version = "*", features = ["full", "tracing"] }

# Logging and tracing
# tracing = "*"
# tracing-subscriber = { version = "*", features = [
#     "ansi",
#     "chrono",
#     "env-filter",
#     "serde",
#     "std",
# ] }


# Extra stuff
# tokio-util = { version = "*", features = ["codec"] }
# toml = "*"
# dirs = "*" # Useful to get XDG spec dirs

# Utilities
# async-trait = "*"
# static-toml = "*"
# walkdir = "*"
# chrono = "*"
# itertools = "*"

######################################################################################################################################################
######################################################################################################################################################


## See `./.cargo_options.toml` for options & brief details & directions

[profile.dev]
opt-level     = 1
codegen-units = 256
incremental   = true
# codegen-backend  = "cranelift"
debug            = "line-tables-only"
debug-assertions = true
overflow-checks  = true
strip            = "none"             # true | false | "none" | "symbols" | "debuginfo" ## Leave off @ w. THIS IS NOT OBFUSCATION.
panic            = "abort"            # "unwind" | "abort"
lto              = "off"              # "false" ### # true | false | "off" | "thin" | "fat" ## Can't use with cranelift yet
# trim-paths       = "none"
# rustflags        = ["-Zthreads=16"]
# tune-cpu         = "native"

######################################################################################################################################################

[profile.release]
opt-level     = 3
codegen-units = 1
incremental   = false
# codegen-backend  = "cranelift"                 # May break deps.
debug            = "none"
debug-assertions = false
overflow-checks  = false     # debatable
strip            = "symbols" # true | false | "none" | "symbols" | "debuginfo" ## Leave off @ w. THIS IS NOT OBFUSCATION.
panic            = "unwind"
lto              = "off"     # true | false | "off" | "thin" | "fat" ## Can't use with cranelift yet
# trim-paths       = [ "diagnostics", "object" ]
# rustflags        = ["-Zthreads=16"]
# tune-cpu         = "native"


[profile.dev.package."*"]
inherits = "release"
# codegen-backend = "cranelift" #### May break deps. for external crates

[profile.release.package."*"]
inherits = "release"
# codegen-backend = "cranelift" #### May break deps. for external crates??????

######################################################################################################################################################
######################################################################################################################################################

# Lint levels / priorities/priority
# 0 = forbid
# 1 = deny
# 2 = warn
# 3 = allow
[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
# unsafe_code = "forbid"

[lints.clippy]
enum_glob_use    = { level = "warn", priority = 2 }
indexing_slicing = { level = "deny", priority = 2 }
string_slice     = { level = "deny", priority = 2 }

[build-dependencies]
prost       = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
